name: JSON Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: json-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-slim

    steps:
      - name: Restore previous state
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .monitor-state
          key: json-monitor-state-${{ github.run_id }}
          restore-keys: |
            json-monitor-state-

      - name: Check API
        id: check
        env:
          API_URL_B64: ${{ secrets.API_URL_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.parse
          import urllib.request

          # Decode the API URL from the GitHub Secret.
          url = base64.b64decode(
              os.environ["API_URL_B64"]
          ).decode("utf-8")

          # Make the request.
          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "okhttp/4.10.0"
              }
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              raw = response.read()

          # Parse JSON.
          data = json.loads(raw)

          # Normalize JSON so insignificant formatting/key-order
          # differences don't count as changes.
          normalized = json.dumps(
              data,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=False
          )

          current_hash = hashlib.sha256(
              normalized.encode("utf-8")
          ).hexdigest()

          os.makedirs(".monitor-state", exist_ok=True)

          state_file = ".monitor-state/hash"
          old_hash = ""

          if os.path.exists(state_file):
              with open(state_file, "r") as f:
                  old_hash = f.read().strip()

          # First run: establish a baseline.
          if not old_hash:
              print("First run. Establishing baseline.")

          elif current_hash != old_hash:
              print("JSON CHANGED!")

              message = (
                  "JSON changed!"
              )

              params = urllib.parse.urlencode({
                  "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                  "text": message
              })

              telegram_url = (
                  "https://api.telegram.org/bot"
                  + os.environ["TELEGRAM_BOT_TOKEN"]
                  + "/sendMessage?"
                  + params
              )

              with urllib.request.urlopen(
                  telegram_url,
                  timeout=30
              ) as telegram_response:
                  telegram_response.read()

              print("Telegram notification sent.")

          else:
              print("No change.")

          # Save the current hash for the next run.
          with open(state_file, "w") as f:
              f.write(current_hash)
          PY

      - name: Save current state
        uses: actions/cache/save@v4
        with:
          path: .monitor-state
          key: json-monitor-state-${{ github.run_id }}
