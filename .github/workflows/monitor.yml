name: JSON Monitor

on:
  push:
    branches:
      - main

  schedule:
    - cron: "7,22,37,52 * * * *"

  workflow_dispatch:

concurrency:
  group: json-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-slim

    steps:
      - name: Check API
        env:
          API_URL_B64: ${{ secrets.API_URL_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_VARIABLE_TOKEN: ${{ secrets.GH_VARIABLE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          # ------------------------------------------------------------
          # Configuration
          # ------------------------------------------------------------

          variable_name = "JSON_MONITOR_HASH"

          api_url = base64.b64decode(
              os.environ["API_URL_B64"]
          ).decode("utf-8")

          repository = os.environ["GITHUB_REPOSITORY"]
          github_token = os.environ["GH_VARIABLE_TOKEN"]

          # ------------------------------------------------------------
          # Fetch API
          # ------------------------------------------------------------

          request = urllib.request.Request(
              api_url,
              headers={
                  "User-Agent": "okhttp/4.10.0"
              }
          )

          with urllib.request.urlopen(
              request,
              timeout=30
          ) as response:
              raw = response.read()

          # ------------------------------------------------------------
          # Parse and normalize JSON
          # ------------------------------------------------------------

          data = json.loads(raw)

          normalized = json.dumps(
              data,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=False
          )

          current_hash = hashlib.sha256(
              normalized.encode("utf-8")
          ).hexdigest()

          print("Current JSON hash:", current_hash)

          # ------------------------------------------------------------
          # GitHub Variables API helpers
          # ------------------------------------------------------------

          github_api_base = (
              "https://api.github.com/repos/"
              + repository
              + "/actions/variables/"
          )

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + github_token,
              "X-GitHub-Api-Version": "2026-03-10",
              "Content-Type": "application/json"
          }

          variable_url = (
              github_api_base
              + urllib.parse.quote(
                  variable_name,
                  safe=""
              )
          )

          # ------------------------------------------------------------
          # Read previous hash
          # ------------------------------------------------------------

          old_hash = ""

          get_request = urllib.request.Request(
              variable_url,
              headers=headers,
              method="GET"
          )

          try:
              with urllib.request.urlopen(
                  get_request,
                  timeout=30
              ) as response:
                  variable_data = json.loads(
                      response.read()
                  )

              old_hash = variable_data.get(
                  "value",
                  ""
              ).strip()

          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise

              print(
                  "No previous state variable found. "
                  "This is the first run."
              )

          # ------------------------------------------------------------
          # Compare hashes
          # ------------------------------------------------------------

          if not old_hash:
              print(
                  "First run. Establishing baseline. "
                  "No Telegram notification."
              )

          elif current_hash != old_hash:
              print("JSON CHANGED!")

              message = "JSON changed!"

              params = urllib.parse.urlencode({
                  "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                  "text": message
              })

              telegram_url = (
                  "https://api.telegram.org/bot"
                  + os.environ["TELEGRAM_BOT_TOKEN"]
                  + "/sendMessage?"
                  + params
              )

              with urllib.request.urlopen(
                  telegram_url,
                  timeout=30
              ) as telegram_response:
                  telegram_response.read()

              print("Telegram notification sent.")

          else:
              print("No change.")

          # ------------------------------------------------------------
          # Save current hash to GitHub repository variable
          # ------------------------------------------------------------

          payload = json.dumps({
              "name": variable_name,
              "value": current_hash
          }).encode("utf-8")

          # Try to update existing variable.
          update_request = urllib.request.Request(
              variable_url,
              data=payload,
              headers=headers,
              method="PATCH"
          )

          try:
              with urllib.request.urlopen(
                  update_request,
                  timeout=30
              ) as response:
                  response.read()

              print(
                  "State saved to GitHub repository variable."
              )

          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise

              # Variable doesn't exist yet, so create it.
              create_url = (
                  "https://api.github.com/repos/"
                  + repository
                  + "/actions/variables"
              )

              create_request = urllib.request.Request(
                  create_url,
                  data=payload,
                  headers=headers,
                  method="POST"
              )

              with urllib.request.urlopen(
                  create_request,
                  timeout=30
              ) as response:
                  response.read()

              print(
                  "State variable created successfully."
              )
          PY
